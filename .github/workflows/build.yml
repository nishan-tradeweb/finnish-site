# Finnish website: extracts finnish-website.zip and publishes it to the "gh-pages" branch.
# Put this file at  .github/workflows/build.yml  (replace the old one).
# One-time setting: Settings > Pages > Build and deployment > Source: "Deploy from a branch", Branch: gh-pages, folder: / (root).
name: Deploy Finnish website

on:
  push:
    branches: [main]
    paths:
      - "finnish-website.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract finnish-website.zip
        run: |
          test -f finnish-website.zip || { echo "finnish-website.zip not found in the repository root"; exit 1; }
          rm -rf _site && mkdir _site
          unzip -q finnish-website.zip -d _site
          if [ ! -f _site/index.html ]; then
            inner=$(find _site -maxdepth 2 -name index.html | head -n1 | xargs -r dirname)
            [ -n "$inner" ] || { echo "index.html not found in the zip"; exit 1; }
            mv "$inner"/* "$inner"/.[!.]* _site/ 2>/dev/null || true
          fi
          touch _site/.nojekyll
          find _site -maxdepth 2 | head -40

      - name: Publish to gh-pages branch
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy website"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
